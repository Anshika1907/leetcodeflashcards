null;\n\n        \n    }\n}", "lang": "java"}, {"title": "Find Minimum in Rotated Sorted Array", "slug": "find-minimum-in-rotated-sorted-array", "difficulty": "Medium", "topics": ["Array", "Binary Search"], "description": "Suppose an array of length n sorted in ascending order is rotated between 1 and n times. For example, the array nums = [0,1,2,4,5,6,7] might become:\n\n\t[4,5,6,7,0,1,2] if it was rotated 4 times.\n\n\t[0,1,2,4,5,6,7] if it was rotated 7 times.\n\nNotice that rotating an array [a[0], a[1], a[2], ..., a[n-1]] 1 time results in the array [a[n-1], a[0], a[1], a[2], ..., a[n-2]].\n\nGiven the sorted rotated array nums of unique elements, return the minimum element of this array.\n\nYou must write an algorithm that runs in O(log n) time.\n\n \n\nExample 1:\n\nInput: nums = [3,4,5,1,2]\nOutput: 1\nExplanation: The original array was [1,2,3,4,5] rotated 3 times.\n\nExample 2:\n\nInput: nums = [4,5,6,7,0,1,2]\nOutput: 0\nExplanation: The original array was [0,1,2,4,5,6,7] and it was rotated 4 times.\n\nExample 3:\n\nInput: nums = [11,13,15,17]\nOutput: 11\nExplanation: The original array was [11,13,15,17] and it was rotated 4 times. \n\n \n\nConstraints:\n\n\tn == nums.length\n\n\t1 <= n <= 5000\n\n\t-5000 <= nums[i] <= 5000\n\n\tAll the integers of nums are unique.\n\n\tnums is sorted and rotated between 1 and n times.", "code": "class Solution {\n    public int findMin(int[] nums) {\n        int str=0;\n        int n=nums.length;\n        int end=n-1;\n        int pv=-1;\n        /*if(nums[str]<nums[end]){\n            return nums[0];\n        }\n        else{\n            while(str<=end){\n                int mid=str+(end-str)/2;\n                if(nums[mid]<=nums[n-1]){\n                    end=mid-1;\n                }\n                else{\n                    pv=mid;\n                    str=mid+1;\n                }\n            }\n            return nums[pv+1];\n        }*/\n        while(str<=end){\n            int mid=str+(end-str)/2;\n            if(nums[mid]<=nums[n-1]){\n                end=mid-1;\n            }\n            else{\n                pv=mid;\n                str=mid+1;\n            }\n        }\n        if(pv==-1){\n            return nums[0];\n        }\n        else{\n            return nums[pv+1];\n        }\n\n\n\n\n\n       \n       \n    }\n}", "lang": "java"}, {"title": "Reverse Words in a String", "slug": "reverse-words-in-a-string", "difficulty": "Medium", "topics": ["Two Pointers", "String"], "description": "Given an input string s, reverse the order of the words.\n\nA word is defined as a sequence of non-space characters. The words in s will be separated by at least one space.\n\nReturn a string of the words in reverse order concatenated by a single space.\n\nNote that s may contain leading or trailing spaces or multiple spaces between two words. The returned string should only have a single space separating the words. Do not include any extra spaces.\n\n \n\nExample 1:\n\nInput: s = \"the sky is blue\"\nOutput: \"blue is sky the\"\n\nExample 2:\n\nInput: s = \"  hello world  \"\nOutput: \"world hello\"\nExplanation: Your reversed string should not contain leading or trailing spaces.\n\nExample 3:\n\nInput: s = \"a good   example\"\nOutput: \"example good a\"\nExplanation: You need to reduce multiple spaces between two words to a single space in the reversed string.\n\n \n\nConstraints:\n\n\t1 <= s.length <= 104\n\n\ts contains English letters (upper-case and lower-case), digits, and spaces ' '.\n\n\tThere is at least one word in s.\n\n \n\nFollow-up: If the string data type is mutable in your language, can you solve it in-place with O(1) extra space?", "code": "class Solution {\n    public String reverseWords(String s) {\n        s=s.trim();\n        String[] arr=s.split(\"\\\\s+\");\n        String ns=\"\";\n        for(int i=arr.length-1;i>=0;i--){\n            ns=ns+arr[i]+\" \";\n\n        }\n        ns=ns.trim();\n        return ns;\n\n    }\n}", "lang": "java"}, {"title": "Reorder List", "slug": "reorder-list", "difficulty": "Medium", "topics": ["Linked List", "Two Pointers", "Stack", "Recursion"], "description": "You are given the head of a singly linked-list. The list can be represented as:\n\nL0 &rarr; L1 &rarr; &hellip; &rarr; Ln - 1 &rarr; Ln\n\nReorder the list to be on the following form:\n\nL0 &rarr; Ln &rarr; L1 &rarr; Ln - 1 &rarr; L2 &rarr; Ln - 2 &rarr; &hellip;\n\nYou may not modify the values in the list's nodes. Only nodes themselves may be changed.\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4]\nOutput: [1,4,2,3]\n\nExample 2:\n\nInput: head = [1,2,3,4,5]\nOutput: [1,5,2,4,3]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is in the range [1, 5 * 104].\n\n\t1 <= Node.val <= 1000", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode midd(ListNode head){\n        ListNode slow=head;\n        ListNode fast=head;\n        while(fast!=null){\n            fast=fast.next;\n            if(fast!=null){\n                slow=slow.next;\n                fast=fast.next;\n            }\n        }\n        return slow;\n    }\n    public ListNode rev(ListNode head) {\n        ListNode prev=null;\n        ListNode current=head;\n        while(current!=null){\n            ListNode forward=current.next;\n            current.next=prev;\n            prev=current;\n            current=forward;\n        }\n        return prev;\n    }\n\n    public void reorderList(ListNode head) {\n        ListNode mid=midd(head);\n        ListNode sec=mid.next;\n        mid.next=null;\n        ListNode temp2=rev(sec);\n        ListNode temp=head;\n        while(temp!=null && temp2!=null){\n            ListNode p=temp.next;\n            ListNode q=temp2.next;\n            temp.next=temp2;\n            temp2.next=p;\n            temp2=q;\n            temp=p;\n        }\n\n        \n    }\n}", "lang": "java"}, {"title": "Linked List Cycle II", "slug": "linked-list-cycle-ii", "difficulty": "Medium", "topics": ["Hash Table", "Linked List", "Two Pointers", "Floyd's Cycle Finding Algorithm"], "description": "Given the head of a linked list, return the node where the cycle begins. If there is no cycle, return null.\n\nThere is a cycle in a linked list if there is some node in the list that can be reached again by continuously following the next pointer. Internally, pos is used to denote the index of the node that tail's next pointer is connected to (0-indexed). It is -1 if there is no cycle. Note that pos is not passed as a parameter.\n\nDo not modify the linked list.\n\n \n\nExample 1:\n\nInput: head = [3,2,0,-4], pos = 1\nOutput: tail connects to node index 1\nExplanation: There is a cycle in the linked list, where tail connects to the second node.\n\nExample 2:\n\nInput: head = [1,2], pos = 0\nOutput: tail connects to node index 0\nExplanation: There is a cycle in the linked list, where tail connects to the first node.\n\nExample 3:\n\nInput: head = [1], pos = -1\nOutput: no cycle\nExplanation: There is no cycle in the linked list.\n\n \n\nConstraints:\n\n\tThe number of the nodes in the list is in the range [0, 104].\n\n\t-105 <= Node.val <= 105\n\n\tpos is -1 or a valid index in the linked-list.\n\n \n\nFollow up: Can you solve it using O(1) (i.e. constant) memory?", "code": "/**\n * Definition for singly-linked list.\n * class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode(int x) {\n *         val = x;\n *         next = null;\n *     }\n * }\n */\npublic class Solution {\n    public ListNode detectCycle(ListNode head) {\n        /*\n        HashMap<ListNode,Boolean> ls=new HashMap<>();\n        ListNode temp=head;\n        while(temp!=null){\n            if( ls.get(temp)!=null && ls.get(temp)==true){\n                return temp;\n            }\n            else{\n                ls.put(temp,true);\n            }\n            temp=temp.next;\n        }\n        return null; */\n        if(head==null){\n            return null;\n        }\n        if(head.next==null){\n            return null;\n        }\n        ListNode fast=head;\n        ListNode slow=head;\n        while(fast!=null){\n            fast=fast.next;\n            if(fast!=null){\n                fast=fast.next;\n                slow=slow.next;\n            }\n            if(fast==slow){\n                break;\n            }\n        }\n        ListNode temp=head;\n        while(temp!=null && slow!=null){\n            if(slow==temp){\n                return temp;\n            }\n            temp=temp.next;\n            slow=slow.next;\n        }\n        return null;\n\n\n\n    }\n}", "lang": "java"}, {"title": "Linked List Cycle", "slug": "linked-list-cycle", "difficulty": "Easy", "topics": ["Hash Table", "Linked List", "Two Pointers", "Floyd's Cycle Finding Algorithm"], "description": "Given head, the head of a linked list, determine if the linked list has a cycle in it.\n\nThere is a cycle in a linked list if there is some node in the list that can be reached again by continuously following the next pointer. Internally, pos is used to denote the index of the node that tail's next pointer is connected to. Note that pos is not passed as a parameter.\n\nReturn true if there is a cycle in the linked list. Otherwise, return false.\n\n \n\nExample 1:\n\nInput: head = [3,2,0,-4], pos = 1\nOutput: true\nExplanation: There is a cycle in the linked list, where the tail connects to the 1st node (0-indexed).\n\nExample 2:\n\nInput: head = [1,2], pos = 0\nOutput: true\nExplanation: There is a cycle in the linked list, where the tail connects to the 0th node.\n\nExample 3:\n\nInput: head = [1], pos = -1\nOutput: false\nExplanation: There is no cycle in the linked list.\n\n \n\nConstraints:\n\n\tThe number of the nodes in the list is in the range [0, 104].\n\n\t-105 <= Node.val <= 105\n\n\tpos is -1 or a valid index in the linked-list.\n\n \n\nFollow up: Can you solve it using O(1) (i.e. constant) memory?", "code": "/**\n * Definition for singly-linked list.\n * class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode(int x) {\n *         val = x;\n *         next = null;\n *     }\n * }\n */\npublic class Solution {\n    public boolean hasCycle(ListNode head) {\n        ListNode fast=head;\n        ListNode slow=head;\n        while(fast!=null){\n            fast=fast.next;\n            if(fast!=null){\n                fast=fast.next;\n                slow=slow.next;\n            }\n            if(slow==fast){\n                return true;\n            }\n        }\n        return false;\n\n    }\n}", "lang": "java"}, {"title": "Single Number", "slug": "single-number", "difficulty": "Easy", "topics": ["Array", "Bit Manipulation"], "description": "Given a non-empty array of integers nums, every element appears twice except for one. Find that single one.\n\nYou must implement a solution with a linear runtime complexity and use only constant extra space.\n\n \n\nExample 1:\n\nInput: nums = [2,2,1]\n\nOutput: 1\n\nExample 2:\n\nInput: nums = [4,1,2,1,2]\n\nOutput: 4\n\nExample 3:\n\nInput: nums = [1]\n\nOutput: 1\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 3 * 104\n\n\t-3 * 104 <= nums[i] <= 3 * 104\n\n\tEach element in the array appears twice except for one element which appears only once.", "code": "class Solution {\n    public int singleNumber(int[] nums) {\n        int xorsum=0;\n        for(int val: nums){\n            xorsum=xorsum^val;\n        }\n        return xorsum;\n       \n\n        \n    }\n}", "lang": "java"}, {"title": "Longest Consecutive Sequence", "slug": "longest-consecutive-sequence", "difficulty": "Medium", "topics": ["Array", "Hash Table", "Union-Find"], "description": "Given an unsorted array of integers nums, return the length of the longest consecutive elements sequence.\n\nYou must write an algorithm that runs in O(n) time.\n\n \n\nExample 1:\n\nInput: nums = [100,4,200,1,3,2]\nOutput: 4\nExplanation: The longest consecutive elements sequence is [1, 2, 3, 4]. Therefore its length is 4.\n\nExample 2:\n\nInput: nums = [0,3,7,2,5,8,4,6,0,1]\nOutput: 9\n\nExample 3:\n\nInput: nums = [1,0,1,2]\nOutput: 3\n\n \n\nConstraints:\n\n\t0 <= nums.length <= 105\n\n\t-109 <= nums[i] <= 109", "code": "class Solution {\n    public int longestConsecutive(int[] nums) {\n        Arrays.sort(nums);\n        int count=1;\n        int max=1;\n        if(nums.length==0){\n            return 0;\n        }\n        for(int i=0;i<nums.length-1;i++){\n            if(nums[i]+1==nums[i+1]){\n                count++;\n                if(count>max){\n                    max=count;\n                }\n            }\n            else if(nums[i]==nums[i+1]){\n                \n            }\n\n            else{\n                count=1;\n\n            }\n\n        }\n        return max;\n        \n    }\n}", "lang": "java"}, {"title": "Valid Palindrome", "slug": "valid-palindrome", "difficulty": "Easy", "topics": ["Two Pointers", "String"], "description": "A phrase is a palindrome if, after converting all uppercase letters into lowercase letters and removing all non-alphanumeric characters, it reads the same forward and backward. Alphanumeric characters include letters and numbers.\n\nGiven a string s, return true if it is a palindrome, or false otherwise.\n\n \n\nExample 1:\n\nInput: s = \"A man, a plan, a canal: Panama\"\nOutput: true\nExplanation: \"amanaplanacanalpanama\" is a palindrome.\n\nExample 2:\n\nInput: s = \"race a car\"\nOutput: false\nExplanation: \"raceacar\" is not a palindrome.\n\nExample 3:\n\nInput: s = \" \"\nOutput: true\nExplanation: s is an empty string \"\" after removing non-alphanumeric characters.\nSince an empty string reads the same forward and backward, it is a palindrome.\n\n \n\nConstraints:\n\n\t1 <= s.length <= 2 * 105\n\n\ts consists only of printable ASCII characters.", "code": "class Solution {\n    public boolean isPalindrome(String s) {\n        s=s.toLowerCase();\n        String str=\"\";\n        for(int i=0;i<s.length();i++){\n            if((s.charAt(i)>='a'  && s.charAt(i)<='z') || (s.charAt(i)>='0' && s.charAt(i)<='9')){\n                str=str+s.charAt(i);\n            }\n        }\n        String newstr=\"\";\n        for(int j=str.length()-1;j>=0;j--){\n            newstr=newstr+str.charAt(j);\n        }\n        if(newstr.equals(str)){\n            return true;\n        }\n        else{\n            return false;\n        }\n\n         \n    }\n}", "lang": "java"}, {"title": "Best Time to Buy and Sell Stock", "slug": "best-time-to-buy-and-sell-stock", "difficulty": "Easy", "topics": ["Array", "Dynamic Programming"], "description": "You are given an array prices where prices[i] is the price of a given stock on the ith day.\n\nYou want to maximize your profit by choosing a single day to buy one stock and choosing a different day in the future to sell that stock.\n\nReturn the maximum profit you can achieve from this transaction. If you cannot achieve any profit, return 0.\n\n \n\nExample 1:\n\nInput: prices = [7,1,5,3,6,4]\nOutput: 5\nExplanation: Buy on day 2 (price = 1) and sell on day 5 (price = 6), profit = 6-1 = 5.\nNote that buying on day 2 and selling on day 1 is not allowed because you must buy before you sell.\n\nExample 2:\n\nInput: prices = [7,6,4,3,1]\nOutput: 0\nExplanation: In this case, no transactions are done and the max profit = 0.\n\n \n\nConstraints:\n\n\t1 <= prices.length <= 105\n\n\t0 <= prices[i] <= 104", "code": "class Solution {\n    public int maxProfit(int[] prices) {\n        int maxprofit=0;\n        int minval=prices[0];\n        for(int i=0;i<prices.length;i++){\n            if(minval>prices[i]){\n                minval=prices[i];\n            }\n            int profit=prices[i]-minval;\n            if(profit>maxprofit){\n                maxprofit=profit;\n            }\n\n        }\n\n        return maxprofit;\n    }\n}", "lang": "java"}, {"title": "Reverse Linked List II", "slug": "reverse-linked-list-ii", "difficulty": "Medium", "topics": ["Linked List"], "description": "Given the head of a singly linked list and two integers left and right where left <= right, reverse the nodes of the list from position left to position right, and return the reversed list.\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4,5], left = 2, right = 4\nOutput: [1,4,3,2,5]\n\nExample 2:\n\nInput: head = [5], left = 1, right = 1\nOutput: [5]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is n.\n\n\t1 <= n <= 500\n\n\t-500 <= Node.val <= 500\n\n\t1 <= left <= right <= n\n\n \n\nFollow up: Could you do it in one pass?", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode reverseBetween(ListNode head, int left, int right) {\n        if(left==right){\n            return head;\n        }\n        ListNode temp=head;\n        for(int i=1;i<left-1;i++){\n            temp=temp.next;\n        }\n        ListNode p=(left==1)?null:temp;\n        ListNode cur=(left==1)?head:temp.next;\n        ListNode tail=cur;\n        ListNode prev=null;\n        for(int j=1;j<=(right-left+1); j++){\n            ListNode frd=cur.next;\n            cur.next=prev;\n            prev=cur;\n            cur=frd;\n        }\n        tail.next=cur;\n        if(left==1){\n            return prev;\n        }\n        else{\n            p.next=prev;\n            \n        }\n        return head;      \n        \n    }\n}", "lang": "java"}, {"title": "Merge Sorted Array", "slug": "merge-sorted-array", "difficulty": "Easy", "topics": ["Array", "Two Pointers", "Sorting"], "description": "You are given two integer arrays nums1 and nums2, sorted in non-decreasing order, and two integers m and n, representing the number of elements in nums1 and nums2 respectively.\n\nMerge nums1 and nums2 into a single array sorted in non-decreasing order.\n\nThe final sorted array should not be returned by the function, but instead be stored inside the array nums1. To accommodate this, nums1 has a length of m + n, where the first m elements denote the elements that should be merged, and the last n elements are set to 0 and should be ignored. nums2 has a length of n.\n\n \n\nExample 1:\n\nInput: nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3\nOutput: [1,2,2,3,5,6]\nExplanation: The arrays we are merging are [1,2,3] and [2,5,6].\nThe result of the merge is [1,2,2,3,5,6] with the underlined elements coming from nums1.\n\nExample 2:\n\nInput: nums1 = [1], m = 1, nums2 = [], n = 0\nOutput: [1]\nExplanation: The arrays we are merging are [1] and [].\nThe result of the merge is [1].\n\nExample 3:\n\nInput: nums1 = [0], m = 0, nums2 = [1], n = 1\nOutput: [1]\nExplanation: The arrays we are merging are [] and [1].\nThe result of the merge is [1].\nNote that because m = 0, there are no elements in nums1. The 0 is only there to ensure the merge result can fit in nums1.\n\n \n\nConstraints:\n\n\tnums1.length == m + n\n\n\tnums2.length == n\n\n\t0 <= m, n <= 200\n\n\t1 <= m + n <= 200\n\n\t-109 <= nums1[i], nums2[j] <= 109\n\n \n\nFollow up: Can you come up with an algorithm that runs in O(m + n) time?", "code": "class Solution {\n    public void merge(int[] nums1, int m, int[] nums2, int n) {\n         for(int i=0;i<n;i++){\n            nums1[m]=nums2[i];\n            m++; \n        }\n        Arrays.sort(nums1);\n        \n       \n\n\n    }\n    \n}", "lang": "java"}, {"title": "Partition List", "slug": "partition-list", "difficulty": "Medium", "topics": ["Linked List", "Two Pointers"], "description": "Given the head of a linked list and a value x, partition it such that all nodes less than x come before nodes greater than or equal to x.\n\nYou should preserve the original relative order of the nodes in each of the two partitions.\n\n \n\nExample 1:\n\nInput: head = [1,4,3,2,5,2], x = 3\nOutput: [1,2,2,4,3,5]\n\nExample 2:\n\nInput: head = [2,1], x = 2\nOutput: [1,2]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is in the range [0, 200].\n\n\t-100 <= Node.val <= 100\n\n\t-200 <= x <= 200", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode partition(ListNode head, int x) {\n        ListNode lessHead =new ListNode(-1);\n        ListNode lessTail=lessHead;\n        ListNode greaterHead=new ListNode(-1);\n        ListNode greaterTail=greaterHead;\n        ListNode temp=head;\n        while(temp!=null){\n            if(temp.val<x){\n                lessTail.next=new ListNode(temp.val);\n                lessTail=lessTail.next;\n            }\n            else{\n                greaterTail.next=new ListNode(temp.val);\n                greaterTail=greaterTail.next;\n            }\n            temp=temp.next;\n        }\n        lessTail.next=greaterHead.next;\n        lessHead=lessHead.next;\n        return lessHead;\n        \n    }\n}", "lang": "java"}, {"title": "Remove Duplicates from Sorted List", "slug": "remove-duplicates-from-sorted-list", "difficulty": "Easy", "topics": ["Linked List"], "description": "Given the head of a sorted linked list, delete all duplicates such that each element appears only once. Return the linked list sorted as well.\n\n \n\nExample 1:\n\nInput: head = [1,1,2]\nOutput: [1,2]\n\nExample 2:\n\nInput: head = [1,1,2,3,3]\nOutput: [1,2,3]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is in the range [0, 300].\n\n\t-100 <= Node.val <= 100\n\n\tThe list is guaranteed to be sorted in ascending order.", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode deleteDuplicates(ListNode head) {\n        ListNode slow=head;\n        if(head==null){\n            return head;\n        }\n        if(head.next==null){\n            return head;\n        }\n        ListNode fast=head.next;\n        while(fast!=null){\n            if(fast.val==slow.val){\n                fast=fast.next;\n                if(fast==null){\n                    slow.next=fast;\n                    return head;\n                }\n            }\n            else{\n                slow.next=fast;\n                slow=slow.next;\n                fast=fast.next;\n            }\n        }\n        return head;\n    }\n}", "lang": "java"}, {"title": "Search in Rotated Sorted Array II", "slug": "search-in-rotated-sorted-array-ii", "difficulty": "Medium", "topics": ["Array", "Binary Search"], "description": "There is an integer array nums sorted in non-decreasing order (not necessarily with distinct values).\n\nBefore being passed to your function, nums is rotated at an unknown pivot index k (0 <= k < nums.length) such that the resulting array is [nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]] (0-indexed). For example, [0,1,2,4,4,4,5,6,6,7] might be rotated at pivot index 5 and become [4,5,6,6,7,0,1,2,4,4].\n\nGiven the array nums after the rotation and an integer target, return true if target is in nums, or false if it is not in nums.\n\nYou must decrease the overall operation steps as much as possible.\n\n \n\nExample 1:\n\nInput: nums = [2,5,6,0,0,1,2], target = 0\nOutput: true\nExample 2:\n\nInput: nums = [2,5,6,0,0,1,2], target = 3\nOutput: false\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 5000\n\n\t-104 <= nums[i] <= 104\n\n\tnums is guaranteed to be rotated at some pivot.\n\n\t-104 <= target <= 104\n\n \n\nFollow up: This problem is similar to Search in Rotated Sorted Array, but nums may contain duplicates. Would this affect the runtime complexity? How and why?", "code": "class Solution {\n    public boolean search(int[] nums, int target) {\n       int s=0;\n       int e=nums.length-1;\n       while(s<=e){\n        int mid=s+(e-s)/2;\n        if(nums[mid]==target){\n            return true;\n        }\n        if(nums[s]==nums[mid] && nums[mid]==nums[e]){\n            s=s+1;\n            e=e-1;\n            continue;\n        }\n        else if(nums[s]<=nums[mid]){\n            if(target>=nums[s] && target<=nums[mid]){\n                e=mid-1;\n            }\n            else{\n                s=mid+1;\n            }\n        }\n        else if(nums[mid]<=nums[e]){\n            if(target>=nums[mid] && target<=nums[e]){\n                s=mid+1;\n            }\n            else{\n                e=mid-1;\n            }\n        }\n       }\n       return false;\n    }\n}", "lang": "java"}, {"title": "Remove Duplicates from Sorted Array II", "slug": "remove-duplicates-from-sorted-array-ii", "difficulty": "Medium", "topics": ["Array", "Two Pointers"], "description": "Given an integer array nums sorted in non-decreasing order, remove some duplicates in-place such that each unique element appears at most twice. The relative order of the elements should be kept the same.\n\nSince it is impossible to change the length of the array in some languages, you must instead have the result be placed in the first part of the array nums. More formally, if there are k elements after removing the duplicates, then the first k elements of nums should hold the final result. It does not matter what you leave beyond the first k elements.\n\nReturn k after placing the final result in the first k slots of nums.\n\nDo not allocate extra space for another array. You must do this by modifying the input array in-place with O(1) extra memory.\n\nCustom Judge:\n\nThe judge will test your solution with the following code:\n\nint[] nums = [...]; // Input array\nint[] expectedNums = [...]; // The expected answer with correct length\n\nint k = removeDuplicates(nums); // Calls your implementation\n\nassert k == expectedNums.length;\nfor (int i = 0; i < k; i++) {\n    assert nums[i] == expectedNums[i];\n}\n\nIf all assertions pass, then your solution will be accepted.\n\n \n\nExample 1:\n\nInput: nums = [1,1,1,2,2,3]\nOutput: 5, nums = [1,1,2,2,3,_]\nExplanation: Your function should return k = 5, with the first five elements of nums being 1, 1, 2, 2 and 3 respectively.\nIt does not matter what you leave beyond the returned k (hence they are underscores).\n\nExample 2:\n\nInput: nums = [0,0,1,1,1,1,2,3,3]\nOutput: 7, nums = [0,0,1,1,2,3,3,_,_]\nExplanation: Your function should return k = 7, with the first seven elements of nums being 0, 0, 1, 1, 2, 3 and 3 respectively.\nIt does not matter what you leave beyond the returned k (hence they are underscores).\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 3 * 104\n\n\t-104 <= nums[i] <= 104\n\n\tnums is sorted in non-decreasing order.", "code": "class Solution {\n    public int removeDuplicates(int[] nums) {\n        int i=2;\n        for(int j=2;j<nums.length;j++){\n            if(nums[j]!=nums[i-2]){\n                nums[i]=nums[j];\n                i++;\n            }\n        }\n       \n        \n        return i;\n    }\n}", "lang": "java"}, {"title": "Sort Colors", "slug": "sort-colors", "difficulty": "Medium", "topics": ["Array", "Two Pointers", "Sorting", "Quicksort", "Bubble Sort"], "description": "You are given an array nums with n objects colored red, white, or blue, sort them in-place so that objects of the same color are adjacent, with the colors in the order red, white, and blue.\n\nWe will use the integers 0, 1, and 2 to represent the color red, white, and blue, respectively.\n\nYou must solve this problem without using the library's sort function.\n\n \n\nExample 1:\n\nInput: nums = [2,0,2,1,1,0]\n\nOutput: [0,0,1,1,2,2]\n\nExplanation:\n\nThe array has two 0s, two 1s, and two 2s. Sorting them in-place places all 0s first, then all 1s, then all 2s.\n\nExample 2:\n\nInput: nums = [2,0,1]\n\nOutput: [0,1,2]\n\nExplanation:\n\nThe array has one each of 0, 1, and 2, arranged in-place in the order 0, 1, 2.\n\n \n\nConstraints:\n\n\tn == nums.length\n\n\t1 <= n <= 300\n\n\tnums[i] is either 0, 1, or 2.\n\n \n\nFollow up: Could you come up with a one-pass algorithm using only constant extra space?", "code": "class Solution {\n    public void sortColors(int[] nums) {\n        int n=nums.length;\n        for(int i=0;i<n-1;i++){\n            for(int j=0;j<n-i-1;j++){\n                if(nums[j]> nums[j+1]){\n                    int temp=nums[j];\n                    nums[j]=nums[j+1];\n                    nums[j+1]=temp;\n                }\n            }\n        }\n    }\n}", "lang": "java"}, {"title": "Search a 2D Matrix", "slug": "search-a-2d-matrix", "difficulty": "Medium", "topics": ["Array", "Binary Search", "Matrix"], "description": "You are given an m x n integer matrix matrix with the following two properties:\n\n\tEach row is sorted in non-decreasing order.\n\n\tThe first integer of each row is greater than the last integer of the previous row.\n\nGiven an integer target, return true if target is in matrix or false otherwise.\n\nYou must write a solution in O(log(m * n)) time complexity.\n\n \n\nExample 1:\n\nInput: matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3\nOutput: true\n\nExample 2:\n\nInput: matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 13\nOutput: false\n\n \n\nConstraints:\n\n\tm == matrix.length\n\n\tn == matrix[i].length\n\n\t1 <= m, n <= 100\n\n\t-104 <= matrix[i][j], target <= 104", "code": "class Solution {\n    public boolean searchMatrix(int[][] matrix, int target) {\n        int m=matrix.length;\n        int n=matrix[0].length;\n        int str=0;\n        int end=m*n-1;\n        while(str<=end){\n            int mid=str+(end-str)/2;\n            int row=mid/n;\n            int col=mid%n;\n            if(matrix[row][col]==target){\n                return true;\n            }\n            else if(matrix[row][col]>target){\n                end=mid-1;\n            }\n            else{\n                str=mid+1;\n            }\n\n        }\n        return false;\n    }\n}", "lang": "java"}, {"title": "Sqrt(x)", "slug": "sqrtx", "difficulty": "Easy", "topics": ["Math", "Binary Search", "Newton's Method"], "description": "Given a non-negative integer x, return the square root of x rounded down to the nearest integer. The returned integer should be non-negative as well.\n\nYou must not use any built-in exponent function or operator.\n\n\tFor example, do not use pow(x, 0.5) in c++ or x ** 0.5 in python.\n\n \n\nExample 1:\n\nInput: x = 4\nOutput: 2\nExplanation: The square root of 4 is 2, so we return 2.\n\nExample 2:\n\nInput: x = 8\nOutput: 2\nExplanation: The square root of 8 is 2.82842..., and since we round it down to the nearest integer, 2 is returned.\n\n \n\nConstraints:\n\n\t0 <= x <= 231 - 1", "code": "class Solution {\n    public int mySqrt(int x) {\n        int str=1;\n        int end=x;\n        int ans=-1;\n        if(x==0){\n            return 0;\n        }\n        while(str<=end){\n            int mid=str+(end-str)/2;\n            if(mid>x/mid){\n                end=mid-1;\n            }\n            else{\n                ans=mid;\n                str=mid+1;\n            }\n        }\n        return ans;\n        \n    }\n}", "lang": "java"}, {"title": "Plus One", "slug": "plus-one", "difficulty": "Easy", "topics": ["Array", "Math"], "description": "You are given a large integer represented as an integer array digits, where each digits[i] is the ith digit of the integer. The digits are ordered from most significant to least significant in left-to-right order. The large integer does not contain any leading 0's.\n\nIncrement the large integer by one and return the resulting array of digits.\n\n \n\nExample 1:\n\nInput: digits = [1,2,3]\nOutput: [1,2,4]\nExplanation: The array represents the integer 123.\nIncrementing by one gives 123 + 1 = 124.\nThus, the result should be [1,2,4].\n\nExample 2:\n\nInput: digits = [4,3,2,1]\nOutput: [4,3,2,2]\nExplanation: The array represents the integer 4321.\nIncrementing by one gives 4321 + 1 = 4322.\nThus, the result should be [4,3,2,2].\n\nExample 3:\n\nInput: digits = [9]\nOutput: [1,0]\nExplanation: The array represents the integer 9.\nIncrementing by one gives 9 + 1 = 10.\nThus, the result should be [1,0].\n\n \n\nConstraints:\n\n\t1 <= digits.length <= 100\n\n\t0 <= digits[i] <= 9\n\n\tdigits does not contain any leading 0's.", "code": "class Solution {\n    public int[] plusOne(int[] digits) {\n        int carry=1;\n        for(int i=digits.length-1;i>=0;i--){\n            int sum=digits[i]+carry;\n            int num=sum%10;\n            carry=sum/10;\n            digits[i]=num;\n        }\n        if(carry>0){\n            int[] arr=new int[digits.length+1];\n            int j=1;\n            arr[0]=1;\n            for(int val:digits){\n                arr[j]=val;\n                j++;\n            }\n            return arr;\n        }\n        return digits;\n\n        \n    }\n}", "lang": "java"}, {"title": "Rotate List", "slug": "rotate-list", "difficulty": "Medium", "topics": ["Linked List", "Two Pointers"], "description": "Given the head of a linked list, rotate the list to the right by k places.\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4,5], k = 2\nOutput: [4,5,1,2,3]\n\nExample 2:\n\nInput: head = [0,1,2], k = 4\nOutput: [2,0,1]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is in the range [0, 500].\n\n\t-100 <= Node.val <= 100\n\n\t0 <= k <= 2 * 109", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode rotateRight(ListNode head, int k) {\n        if(head==null || k==0){\n            return head;\n        }\n        ListNode temp=head;\n        int len=1;\n        while(temp.next!=null){\n            len++;\n            temp=temp.next;\n        }\n        temp.next=head;\n        k=k%len;\n        ListNode t=head;\n        for(int i=1;i<=len-k-1;i++){\n            t=t.next;\n        }\n        ListNode headA=t.next;\n        t.next=null;\n        return headA;\n\n\n\n       \n        \n    }\n}", "lang": "java"}, {"title": "Length of Last Word", "slug": "length-of-last-word", "difficulty": "Easy", "topics": ["String"], "description": "Given a string s consisting of words and spaces, return the length of the last word in the string.\n\nA word is a maximal substring consisting of non-space characters only.\n\n \n\nExample 1:\n\nInput: s = \"Hello World\"\nOutput: 5\nExplanation: The last word is \"World\" with length 5.\n\nExample 2:\n\nInput: s = \"   fly me   to   the moon  \"\nOutput: 4\nExplanation: The last word is \"moon\" with length 4.\n\nExample 3:\n\nInput: s = \"luffy is still joyboy\"\nOutput: 6\nExplanation: The last word is \"joyboy\" with length 6.\n\n \n\nConstraints:\n\n\t1 <= s.length <= 104\n\n\ts consists of only English letters and spaces ' '.\n\n\tThere will be at least one word in s.", "code": "class Solution {\n    public int lengthOfLastWord(String s) {\n       /* int count=0;\n        for(int i=s.length()-1;i>=0;i--){\n            if(count==0){\n                if(s.charAt(i)==' '){\n                    count=count+0;\n                }\n                else{\n                    count=count+1;\n                }\n            }\n            else if(count!=0){\n                if(s.charAt(i)==' '){\n                    count=count+0;\n                    break;\n                }\n                else{\n                    count=count+1;\n                }\n            }\n        }\n        return count;  */\n        int count=0;\n        s=s.trim();\n        for(int i=s.length()-1;i>=0;i--){\n            if(s.charAt(i)==' '){\n                return count;\n            }\n            else{\n                count++;\n            }\n        }\n        return count;\n        \n        \n    }\n}", "lang": "java"}, {"title": "Maximum Subarray", "slug": "maximum-subarray", "difficulty": "Medium", "topics": ["Array", "Divide and Conquer", "Dynamic Programming"], "description": "Given an integer array nums, find the subarray with the largest sum, and return its sum.\n\n \n\nExample 1:\n\nInput: nums = [-2,1,-3,4,-1,2,1,-5,4]\nOutput: 6\nExplanation: The subarray [4,-1,2,1] has the largest sum 6.\n\nExample 2:\n\nInput: nums = [1]\nOutput: 1\nExplanation: The subarray [1] has the largest sum 1.\n\nExample 3:\n\nInput: nums = [5,4,-1,7,8]\nOutput: 23\nExplanation: The subarray [5,4,-1,7,8] has the largest sum 23.\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 105\n\n\t-104 <= nums[i] <= 104\n\n \n\nFollow up: If you have figured out the O(n) solution, try coding another solution using the divide and conquer approach, which is more subtle.", "code": "class Solution {\n    public int maxSubArray(int[] nums) {\n        int sum=0;\n        int max=(int)Math.pow(-2,31);\n        for(int i=0;i<nums.length;i++){\n            sum=sum+nums[i];\n            if(sum>max){\n                max=sum;\n            }\n            if(sum<0){\n                sum=0;\n            }\n        }\n        return max;\n    }\n}", "lang": "java"}, {"title": "Pow(x, n)", "slug": "powx-n", "difficulty": "Medium", "topics": ["Math", "Recursion"], "description": "Implement pow(x, n), which calculates x raised to the power n (i.e., xn).\n\n \n\nExample 1:\n\nInput: x = 2.00000, n = 10\nOutput: 1024.00000\n\nExample 2:\n\nInput: x = 2.10000, n = 3\nOutput: 9.26100\n\nExample 3:\n\nInput: x = 2.00000, n = -2\nOutput: 0.25000\nExplanation: 2-2 = 1/22 = 1/4 = 0.25\n\n \n\nConstraints:\n\n\t-100.0 < x < 100.0\n\n\t-231 <= n <= 231-1\n\n\tn is an integer.\n\n\tEither x is not zero or n > 0.\n\n\t-104 <= xn <= 104", "code": "class Solution {\n    public double myPow(double x, int n) {\n        double result=Math.pow(x,n);\n        return result;\n        \n    }\n}", "lang": "java"}, {"title": "Rotate Image", "slug": "rotate-image", "difficulty": "Medium", "topics": ["Array", "Math", "Matrix"], "description": "You are given an n x n 2D matrix representing an image, rotate the image by 90 degrees (clockwise).\n\nYou have to rotate the image in-place, which means you have to modify the input 2D matrix directly. DO NOT allocate another 2D matrix and do the rotation.\n\n \n\nExample 1:\n\nInput: matrix = [[1,2,3],[4,5,6],[7,8,9]]\nOutput: [[7,4,1],[8,5,2],[9,6,3]]\n\nExample 2:\n\nInput: matrix = [[5,1,9,11],[2,4,8,10],[13,3,6,7],[15,14,12,16]]\nOutput: [[15,13,2,5],[14,3,4,1],[12,6,8,9],[16,7,10,11]]\n\n \n\nConstraints:\n\n\tn == matrix.length == matrix[i].length\n\n\t1 <= n <= 20\n\n\t-1000 <= matrix[i][j] <= 1000", "code": "class Solution {\n    public void rotate(int[][] matrix) {\n        int n=matrix.length;\n        // transpose\n        for(int i=0;i<n;i++){\n            for(int j=0;j<n;j++){\n                if(i<j){\n                    int temp=matrix[i][j];\n                    matrix[i][j]=matrix[j][i];\n                    matrix[j][i]=temp;\n                }\n            }\n        }\n        // reverse row\n        for(int i=0;i<n;i++){\n            int colfst=0;\n            int collst=n-1;\n            while(colfst<collst){\n                int temp=matrix[i][colfst];\n                matrix[i][colfst]=matrix[i][collst];\n                matrix[i][collst]=temp;\n                colfst++;\n                collst--;\n                \n            }\n        }\n       \n\n    }\n}", "lang": "java"}, {"title": "Search Insert Position", "slug": "search-insert-position", "difficulty": "Easy", "topics": ["Array", "Binary Search"], "description": "Given a sorted array of distinct integers and a target value, return the index if the target is found. If not, return the index where it would be if it were inserted in order.\n\nYou must write an algorithm with O(log n) runtime complexity.\n\n \n\nExample 1:\n\nInput: nums = [1,3,5,6], target = 5\nOutput: 2\n\nExample 2:\n\nInput: nums = [1,3,5,6], target = 2\nOutput: 1\n\nExample 3:\n\nInput: nums = [1,3,5,6], target = 7\nOutput: 4\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 104\n\n\t-104 <= nums[i] <= 104\n\n\tnums contains distinct values sorted in ascending order.\n\n\t-104 <= target <= 104", "code": "class Solution {\n    public int searchInsert(int[] nums, int target) {\n        int s=0;\n        int n=nums.length;\n        int e=n-1;\n        int ans=-1;\n        if(target>nums[e]){\n            ans=e+1;\n            return ans;\n        }\n        while(s<=e){\n            int mid=s+(e-s)/2;\n            if(nums[mid]==target){\n                ans=mid;\n                return ans;\n            }\n            else if(nums[mid]>target){\n                ans=mid;\n                e=mid-1;\n            }\n            else{\n                s=mid+1;\n            }\n        }\n        return ans;\n    }\n}", "lang": "java"}, {"title": "Find First and Last Position of Element in Sorted Array", "slug": "find-first-and-last-position-of-element-in-sorted-array", "difficulty": "Medium", "topics": ["Array", "Binary Search"], "description": "Given an array of integers nums sorted in non-decreasing order, find the starting and ending position of a given target value.\n\nIf target is not found in the array, return [-1, -1].\n\nYou must write an algorithm with O(log n) runtime complexity.\n\n \n\nExample 1:\n\nInput: nums = [5,7,7,8,8,10], target = 8\nOutput: [3,4]\nExample 2:\n\nInput: nums = [5,7,7,8,8,10], target = 6\nOutput: [-1,-1]\nExample 3:\n\nInput: nums = [], target = 0\nOutput: [-1,-1]\n\n \n\nConstraints:\n\n\t0 <= nums.length <= 105\n\n\t-109 <= nums[i] <= 109\n\n\tnums is a non-decreasing array.\n\n\t-109 <= target <= 109", "code": "class Solution {\n    public int[] searchRange(int[] nums, int target) {\n        int[] arr=new int[2];\n        int str=0;\n        int n=nums.length;\n        int end=n-1;\n        int lb=-1;\n        int ub=-1;\n        if(n==0){\n            arr[0]=-1;\n            arr[1]=-1;\n            return arr;\n        }\n        while(str<=end){\n            int mid=str+(end-str)/2;\n            if(nums[mid]==target){\n                lb=mid;\n                end=mid-1;\n            }\n            else if(nums[mid]>target){\n                end=mid-1;\n            }\n            else{\n                str=mid+1;\n            }\n        }\n        str=0;\n        end=n-1;\n        while(str<=end){\n            int mid=str+(end-str)/2;\n            if(nums[mid]>target){\n                ub=mid;\n                end=mid-1;\n            }\n            else{\n                str=mid+1;\n            }\n        }\n        if(lb==-1){\n            arr[0]=arr[1]=-1;\n        }\n        else if(lb!=-1 && ub==-1){\n            arr[0]=lb;\n            arr[1]=n-1;\n        }\n        else{\n            arr[0]=lb;\n            arr[1]=ub-1;\n        }\n        return arr;\n\n\n    }\n}", "lang": "java"}, {"title": "Search in Rotated Sorted Array", "slug": "search-in-rotated-sorted-array", "difficulty": "Medium", "topics": ["Array", "Binary Search"], "description": "There is an integer array nums sorted in ascending order (with distinct values).\n\nPrior to being passed to your function, nums is possibly left rotated at an unknown index k (1 <= k < nums.length) such that the resulting array is [nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]] (0-indexed). For example, [0,1,2,4,5,6,7] might be left rotated by 3 indices and become [4,5,6,7,0,1,2].\n\nGiven the array nums after the possible rotation and an integer target, return the index of target if it is in nums, or -1 if it is not in nums.\n\nYou must write an algorithm with O(log n) runtime complexity.\n\n \n\nExample 1:\n\nInput: nums = [4,5,6,7,0,1,2], target = 0\nOutput: 4\nExample 2:\n\nInput: nums = [4,5,6,7,0,1,2], target = 3\nOutput: -1\nExample 3:\n\nInput: nums = [1], target = 0\nOutput: -1\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 5000\n\n\t-104 <= nums[i] <= 104\n\n\tAll values of nums are unique.\n\n\tnums is an ascending array that is possibly rotated.\n\n\t-104 <= target <= 104", "code": "class Solution {\n    public int search(int[] nums, int target) {\n        // pivoted index\n        int s=0;\n        int n=nums.length;\n        int e=n-1;\n        int pv=-1;\n        while(s<=e){\n            int mid=s+(e-s)/2;\n            if(nums[mid]<=nums[n-1]){\n                e=mid-1;\n            }\n            else{\n                pv=mid;\n                s=mid+1;\n            }\n        }\n        if(pv==-1){\n            int str=0;\n            int end=n-1;\n            while(str<=end){\n                int mid=str+(end-str)/2;\n                if(nums[mid]==target){\n                    return mid;\n                }\n                else if(nums[mid]>target){\n                    end=mid-1;\n                }\n                else{\n                    str=mid+1;\n                }\n\n            }\n            return -1;\n        }\n        else{\n            if(target>=nums[0] && target<=nums[pv]){\n                int str1=0;\n                int end1=pv;\n                while(str1<=end1){\n                    int mid=str1+(end1-str1)/2;\n                    if(nums[mid]==target){\n                        return mid;\n                    }\n                    else if(nums[mid]>target){\n                        end1=mid-1;\n                    }\n                    else{\n                        str1=mid+1;\n                    }\n\n                }\n            }\n            else if(target>=nums[pv+1] && target<=nums[n-1]){\n                int str2=pv+1;\n                int end2=n-1;\n                while(str2<=end2){\n                    int mid=str2+(end2-str2)/2;\n                    if(nums[mid]==target){\n                        return mid;\n                    }\n                    else if(nums[mid]>target){\n                        end2=mid-1;\n                    }\n                    else{\n                        str2=mid+1;\n                    }\n\n                }\n\n            }\n            return -1;\n        }\n        \n    }\n}", "lang": "java"}, {"title": "Find the Index of the First Occurrence in a String", "slug": "find-the-index-of-the-first-occurrence-in-a-string", "difficulty": "Easy", "topics": ["Two Pointers", "String", "String Matching", "Z Algorithm", "Knuth–Morris–Pratt Algorithm", "Boyer–Moore String-Search Algorithm"], "description": "Given two strings needle and haystack, return the index of the first occurrence of needle in haystack, or -1 if needle is not part of haystack.\n\n \n\nExample 1:\n\nInput: haystack = \"sadbutsad\", needle = \"sad\"\nOutput: 0\nExplanation: \"sad\" occurs at index 0 and 6.\nThe first occurrence is at index 0, so we return 0.\n\nExample 2:\n\nInput: haystack = \"leetcode\", needle = \"leeto\"\nOutput: -1\nExplanation: \"leeto\" did not occur in \"leetcode\", so we return -1.\n\n \n\nConstraints:\n\n\t1 <= haystack.length, needle.length <= 104\n\n\thaystack and needle consist of only lowercase English characters.", "code": "class Solution {\n    public int strStr(String haystack, String needle) {\n        int idx=-1;\n        if(haystack.contains(needle)){\n            idx=haystack.indexOf(needle);\n        }\n        return idx;\n    }\n}", "lang": "java"}, {"title": "Remove Duplicates from Sorted Array", "slug": "remove-duplicates-from-sorted-array", "difficulty": "Easy", "topics": ["Array", "Two Pointers"], "description": "Given an integer array nums sorted in non-decreasing order, remove the duplicates in-place such that each unique element appears only once. The relative order of the elements should be kept the same.\n\nConsider the number of unique elements in nums to be k​​​​​​​​​​​​​​. After removing duplicates, return the number of unique elements k.\n\nThe first k elements of nums should contain the unique numbers in sorted order. The remaining elements beyond index k - 1 can be ignored.\n\nCustom Judge:\n\nThe judge will test your solution with the following code:\n\nint[] nums = [...]; // Input array\nint[] expectedNums = [...]; // The expected answer with correct length\n\nint k = removeDuplicates(nums); // Calls your implementation\n\nassert k == expectedNums.length;\nfor (int i = 0; i < k; i++) {\n    assert nums[i] == expectedNums[i];\n}\n\nIf all assertions pass, then your solution will be accepted.\n\n \n\nExample 1:\n\nInput: nums = [1,1,2]\nOutput: 2, nums = [1,2,_]\nExplanation: Your function should return k = 2, with the first two elements of nums being 1 and 2 respectively.\nIt does not matter what you leave beyond the returned k (hence they are underscores).\n\nExample 2:\n\nInput: nums = [0,0,1,1,1,2,2,3,3,4]\nOutput: 5, nums = [0,1,2,3,4,_,_,_,_,_]\nExplanation: Your function should return k = 5, with the first five elements of nums being 0, 1, 2, 3, and 4 respectively.\nIt does not matter what you leave beyond the returned k (hence they are underscores).\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 3 * 104\n\n\t-100 <= nums[i] <= 100\n\n\tnums is sorted in non-decreasing order.", "code": "class Solution {\n    public int removeDuplicates(int[] nums) {\n        // two ponter system\n        int i=0;\n        int j=i+1;\n        while(j<nums.length){\n            if(nums[i]==nums[j]){\n                j++;\n            }\n            else{\n                i++;\n                nums[i]=nums[j];\n                j++;\n            }\n        }\n        return i+1;\n    }\n}", "lang": "java"}, {"title": "Reverse Nodes in k-Group", "slug": "reverse-nodes-in-k-group", "difficulty": "Hard", "topics": ["Linked List", "Recursion"], "description": "Given the head of a linked list, reverse the nodes of the list k at a time, and return the modified list.\n\nk is a positive integer and is less than or equal to the length of the linked list. If the number of nodes is not a multiple of k then left-out nodes, in the end, should remain as it is.\n\nYou may not alter the values in the list's nodes, only nodes themselves may be changed.\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4,5], k = 2\nOutput: [2,1,4,3,5]\n\nExample 2:\n\nInput: head = [1,2,3,4,5], k = 3\nOutput: [3,2,1,4,5]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is n.\n\n\t1 <= k <= n <= 5000\n\n\t0 <= Node.val <= 1000\n\n \n\nFollow-up: Can you solve the problem in O(1) extra memory space?", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode reverseKGroup(ListNode head, int k) {\n        ListNode temp=head;\n        int len=0;\n        while(temp!=null){\n            len++;\n            temp=temp.next;\n        }\n        if(len<k){\n            return head;\n        }\n        ListNode prev=null;\n        ListNode cur=head;\n        for(int i=1;i<=k;i++){\n            ListNode frd=cur.next;\n            cur.next=prev;\n            prev=cur;\n            cur=frd;\n        }\n        ListNode grphead=reverseKGroup(cur,k);\n        head.next=grphead;\n        return prev;\n\n        \n    }\n}", "lang": "java"}, {"title": "Swap Nodes in Pairs", "slug": "swap-nodes-in-pairs", "difficulty": "Medium", "topics": ["Linked List", "Recursion"], "description": "Given a linked list, swap every two adjacent nodes and return its head. You must solve the problem without modifying the values in the list's nodes (i.e., only nodes themselves may be changed.)\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4]\n\nOutput: [2,1,4,3]\n\nExplanation:\n\nExample 2:\n\nInput: head = []\n\nOutput: []\n\nExample 3:\n\nInput: head = [1]\n\nOutput: [1]\n\nExample 4:\n\nInput: head = [1,2,3]\n\nOutput: [2,1,3]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is in the range [0, 100].\n\n\t0 <= Node.val <= 100", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode swapPairs(ListNode head) {\n        if(head==null || head.next==null){\n            return head;\n        }\n        ListNode l1head=new ListNode(-1);\n        ListNode l2head=new ListNode(-1);\n        ListNode l1tail=l1head;\n        ListNode l2tail=l2head;\n        ListNode cur=head;\n        while(cur!=null){\n            ListNode p=cur;\n            cur=cur.next;\n            p.next=null;\n            l1tail.next=p;\n            l1tail=l1tail.next;\n            if(cur!=null){\n                ListNode q=cur;\n                cur=cur.next;\n                q.next=null;\n                l2tail.next=q;\n                l2tail=l2tail.next;\n            }\n        }\n        l1head=l1head.next;\n        l2head=l2head.next;\n        ListNode l1=l1head;\n        ListNode l2=l2head;\n        ListNode Head=new ListNode(-1);\n        ListNode Tail=Head;\n        while(l1!=null && l2!=null){\n            ListNode x=l2;\n            l2=l2.next;\n            x.next=null;\n            Tail.next=x;\n            Tail=Tail.next;\n\n            ListNode y=l1;\n            l1=l1.next;\n            y.next=null;\n            Tail.next=y;\n            Tail=Tail.next;\n        }\n        if(l1==null){\n            Tail.next=l2;\n        }\n        else{\n            Tail.next=l1;\n        }\n        return Head.next;\n\n       \n    }\n}", "lang": "java"}, {"title": "Merge Two Sorted Lists", "slug": "merge-two-sorted-lists", "difficulty": "Easy", "topics": ["Linked List", "Recursion"], "description": "You are given the heads of two sorted linked lists list1 and list2.\n\nMerge the two lists into one sorted list. The list should be made by splicing together the nodes of the first two lists.\n\nReturn the head of the merged linked list.\n\n \n\nExample 1:\n\nInput: list1 = [1,2,4], list2 = [1,3,4]\nOutput: [1,1,2,3,4,4]\n\nExample 2:\n\nInput: list1 = [], list2 = []\nOutput: []\n\nExample 3:\n\nInput: list1 = [], list2 = [0]\nOutput: [0]\n\n \n\nConstraints:\n\n\tThe number of nodes in both lists is in the range [0, 50].\n\n\t-100 <= Node.val <= 100\n\n\tBoth list1 and list2 are sorted in non-decreasing order.", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode mergeTwoLists(ListNode list1, ListNode list2) {\n        ListNode dummy=new ListNode(-1);\n        ListNode head=dummy;\n        ListNode list3=head;\n        while(list1!=null && list2!=null){\n            if(list1.val<=list2.val){\n                list3.next=list1;\n                list1=list1.next;\n                list3=list3.next;\n            }\n            else if(list1.val>list2.val){\n                list3.next=list2;\n                list2=list2.next;\n                list3=list3.next;\n            }\n        }\n        if(list1==null){\n            list3.next=list2;\n        }\n        if(list2==null){\n            list3.next=list1;\n        }\n        head=head.next;\n        return head;\n    }\n}", "lang": "java"}, {"title": "Remove Nth Node From End of List", "slug": "remove-nth-node-from-end-of-list", "difficulty": "Medium", "topics": ["Linked List", "Two Pointers"], "description": "Given the head of a linked list, remove the nth node from the end of the list and return its head.\n\n \n\nExample 1:\n\nInput: head = [1,2,3,4,5], n = 2\nOutput: [1,2,3,5]\n\nExample 2:\n\nInput: head = [1], n = 1\nOutput: []\n\nExample 3:\n\nInput: head = [1,2], n = 1\nOutput: [1]\n\n \n\nConstraints:\n\n\tThe number of nodes in the list is sz.\n\n\t1 <= sz <= 30\n\n\t0 <= Node.val <= 100\n\n\t1 <= n <= sz\n\n \n\nFollow up: Could you do this in one pass?", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode removeNthFromEnd(ListNode head, int n) {\n        ListNode temp=head;\n        int len=0;\n        while(temp!=null){\n            temp=temp.next;\n            len++;\n        }\n        if(n==len){\n            head=head.next;\n            return head;\n        }\n        ListNode fast=head;\n        ListNode slow=head;\n        for(int i=1;i<=n;i++){\n            fast=fast.next;\n        }\n        while(fast.next!=null){\n            fast=fast.next;\n            slow=slow.next;\n        }\n        ListNode p=slow.next.next;\n        slow.next=p;\n        return head;\n    }\n}", "lang": "java"}, {"title": "4Sum", "slug": "4sum", "difficulty": "Medium", "topics": ["Array", "Two Pointers", "Sorting"], "description": "Given an array nums of n integers, return an array of all the unique quadruplets [nums[a], nums[b], nums[c], nums[d]] such that:\n\n\t0 <= a, b, c, d < n\n\n\ta, b, c, and d are distinct.\n\n\tnums[a] + nums[b] + nums[c] + nums[d] == target\n\nYou may return the answer in any order.\n\n \n\nExample 1:\n\nInput: nums = [1,0,-1,0,-2,2], target = 0\nOutput: [[-2,-1,1,2],[-2,0,0,2],[-1,0,0,1]]\n\nExample 2:\n\nInput: nums = [2,2,2,2,2], target = 8\nOutput: [[2,2,2,2]]\n\n \n\nConstraints:\n\n\t1 <= nums.length <= 200\n\n\t-109 <= nums[i] <= 109\n\n\t-109 <= target <= 109", "code": "class Solution {\n    public List<List<Integer>> fourSum(int[] nums, int target) {\n        HashSet<List<Integer>> lst=new HashSet<>();\n        Arrays.sort(nums);\n        int n=nums.length;\n        for(int i=0;i<n-3;i++){\n            for(int j=i+1;j<n-2;j++){\n                int k=j+1;\n                int l=n-1;\n                while(k<l){\n                    List<Integer> l1=new ArrayList<>();\n                    long sum=(long)nums[i]+(long)nums[j]+(long)nums[k]+(long)nums[l];\n                    if(sum==target){\n                        l1.add(nums[i]);\n                        l1.add(nums[j]);\n                        l1.add(nums[k]);\n                        l1.add(nums[l]);\n                        lst.add(l1);\n                        k++;\n                        l--;\n                    }\n                    else if(sum>target){\n                        l--;\n                    }\n                    else{\n                        k++;\n                    }\n                }\n            }\n        }\n       List<List<Integer>> ans=new ArrayList<>(lst) ;\n       return ans;\n    }\n}", "lang": "java"}, {"title": "3Sum", "slug": "3sum", "difficulty": "Medium", "topics": ["Array", "Two Pointers", "Sorting"], "description": "Given an integer array nums, return all the triplets [nums[i], nums[j], nums[k]] such that i != j, i != k, and j != k, and nums[i] + nums[j] + nums[k] == 0.\n\nNotice that the solution set must not contain duplicate triplets.\n\n \n\nExample 1:\n\nInput: nums = [-1,0,1,2,-1,-4]\nOutput: [[-1,-1,2],[-1,0,1]]\nExplanation: \nnums[0] + nums[1] + nums[2] = (-1) + 0 + 1 = 0.\nnums[1] + nums[2] + nums[4] = 0 + 1 + (-1) = 0.\nnums[0] + nums[3] + nums[4] = (-1) + 2 + (-1) = 0.\nThe distinct triplets are [-1,0,1] and [-1,-1,2].\nNotice that the order of the output and the order of the triplets does not matter.\n\nExample 2:\n\nInput: nums = [0,1,1]\nOutput: []\nExplanation: The only possible triplet does not sum up to 0.\n\nExample 3:\n\nInput: nums = [0,0,0]\nOutput: [[0,0,0]]\nExplanation: The only possible triplet sums up to 0.\n\n \n\nConstraints:\n\n\t3 <= nums.length <= 3000\n\n\t-105 <= nums[i] <= 105", "code": "class Solution {\n    public List<List<Integer>> threeSum(int[] nums) {\n        Set<List<Integer>> lst=new HashSet<>();\n        Arrays.sort(nums);\n        int n=nums.length;\n        for(int i=0;i<n-2;i++){\n            int j=i+1;\n            int k=n-1;\n            while(j<k){\n                int sum=nums[i]+nums[j]+nums[k];\n                if(sum==0){\n                    List<Integer> l=new ArrayList<>();\n                    l.add(nums[i]);\n                    l.add(nums[j]);\n                    l.add(nums[k]);\n                    lst.add(l);\n                    j++;\n                    k--;\n                }\n                else if(sum>0){\n                    k--;\n                }\n                else{\n                    j++;\n                }\n            }     \n            \n        }\n        List<List<Integer>> ans=new ArrayList<>(lst);\n        return ans;\n    }\n}\n            ", "lang": "java"}, {"title": "Container With Most Water", "slug": "container-with-most-water", "difficulty": "Medium", "topics": ["Array", "Two Pointers", "Greedy"], "description": "You are given an integer array height of length n. There are n vertical lines drawn such that the two endpoints of the ith line are (i, 0) and (i, height[i]).\n\nFind two lines that together with the x-axis form a container, such that the container contains the most water.\n\nReturn the maximum amount of water a container can store.\n\nNotice that you may not slant the container.\n\n \n\nExample 1:\n\nInput: height = [1,8,6,2,5,4,8,3,7]\nOutput: 49\nExplanation: The above vertical lines are represented by array [1,8,6,2,5,4,8,3,7]. In this case, the max area of water (blue section) the container can contain is 49.\n\nExample 2:\n\nInput: height = [1,1]\nOutput: 1\n\n \n\nConstraints:\n\n\tn == height.length\n\n\t2 <= n <= 105\n\n\t0 <= height[i] <= 104", "code": "class Solution {\n    public int maxArea(int[] height) {\n        int i=0;\n        int n=height.length;\n        int j=n-1;\n        int ans=-1;\n        while(i<j){\n            int min=Math.min(height[i],height[j]);\n            int len=j-i;\n            int area=len*min;\n            if(area>ans){\n                ans=area;\n            }\n            if(height[i]==min){\n                i++;\n            }\n            else{\n                j--;\n            }\n\n        }\n        return ans;\n    }\n}", "lang": "java"}, {"title": "Palindrome Number", "slug": "palindrome-number", "difficulty": "Easy", "topics": ["Math"], "description": "Given an integer x, return true if x is a palindrome, and false otherwise.\n\n \n\nExample 1:\n\nInput: x = 121\nOutput: true\nExplanation: 121 reads as 121 from left to right and from right to left.\n\nExample 2:\n\nInput: x = -121\nOutput: false\nExplanation: From left to right, it reads -121. From right to left, it becomes 121-. Therefore it is not a palindrome.\n\nExample 3:\n\nInput: x = 10\nOutput: false\nExplanation: Reads 01 from right to left. Therefore it is not a palindrome.\n\n \n\nConstraints:\n\n\t-231 <= x <= 231 - 1\n\n \n\nFollow up: Could you solve it without converting the integer to a string?", "code": "class Solution {\n    public boolean isPalindrome(int x) {\n        int temp=x;\n        int sum=0;\n\n        while(x!=0){\n            int rem=x%10;\n            sum=sum*10+rem;\n            x=x/10;\n        }\n        if(temp<0){\n            String a=String.valueOf(temp);\n            String b=String.valueOf(sum);\n            b=b+\"-\";\n            if(a.equals(b)){\n                return true;\n            }\n            else{\n                return false;\n            }\n        }\n        else{\n            if(temp==sum){\n                return true;\n            }\n            else{\n                return false;\n            }\n        }\n        \n\n        \n        \n    }\n}", "lang": "java"}, {"title": "Reverse Integer", "slug": "reverse-integer", "difficulty": "Medium", "topics": ["Math"], "description": "Given a signed 32-bit integer x, return x with its digits reversed. If reversing x causes the value to go outside the signed 32-bit integer range [-231, 231 - 1], then return 0.\n\nAssume the environment does not allow you to store 64-bit integers (signed or unsigned).\n\n \n\nExample 1:\n\nInput: x = 123\nOutput: 321\n\nExample 2:\n\nInput: x = -123\nOutput: -321\n\nExample 3:\n\nInput: x = 120\nOutput: 21\n\n \n\nConstraints:\n\n\t-231 <= x <= 231 - 1", "code": "class Solution {\n    public int reverse(int x) {\n        int ans=0;\n        while(x!=0){\n            int rem =x%10;\n            if(ans>(Math.pow(2,31)-1)/10 || ans==(Math.pow(2,31)-1)/10 && rem>7 ){\n                return 0;\n            }\n            else if(ans<(Math.pow(-2,31))/10 || ans==Math.pow(-2,31)/10 && rem<-8 ){\n                return 0;\n            }\n            ans=ans*10+rem;\n            x=x/10;\n\n        }\n        return ans;\n    }\n}", "lang": "java"}, {"title": "Median of Two Sorted Arrays", "slug": "median-of-two-sorted-arrays", "difficulty": "Hard", "topics": ["Array", "Binary Search", "Divide and Conquer"], "description": "Given two sorted arrays nums1 and nums2 of size m and n respectively, return the median of the two sorted arrays.\n\nThe overall run time complexity should be O(log (m+n)).\n\n \n\nExample 1:\n\nInput: nums1 = [1,3], nums2 = [2]\nOutput: 2.00000\nExplanation: merged array = [1,2,3] and median is 2.\n\nExample 2:\n\nInput: nums1 = [1,2], nums2 = [3,4]\nOutput: 2.50000\nExplanation: merged array = [1,2,3,4] and median is (2 + 3) / 2 = 2.5.\n\n \n\nConstraints:\n\n\tnums1.length == m\n\n\tnums2.length == n\n\n\t0 <= m <= 1000\n\n\t0 <= n <= 1000\n\n\t1 <= m + n <= 2000\n\n\t-106 <= nums1[i], nums2[i] <= 106", "code": "class Solution {\n    public double findMedianSortedArrays(int[] nums1, int[] nums2) {\n        int m=nums1.length;\n        int n=nums2.length;\n        int[] merge=new int[m+n];\n        for(int i=0;i<m;i++){\n            merge[i]=nums1[i];\n        }\n        for(int j=0;j<n;j++){\n            merge[m]=nums2[j];\n            m++;\n        }\n        ArrayList<Integer> list=new ArrayList<>();\n        for(int k=0;k<merge.length;k++){\n            list.add(merge[k]);\n        }\n        Collections.sort(list);\n        \n        if(list.size()%2==0){\n            int a=list.size()/2;\n            double ans=(list.get(a-1)+list.get(a))/2.0;\n            return ans;\n        }\n        else{\n            int a=list.size()/2;\n            double ans=(list.get(a));\n            return ans;\n        }\n        \n\n        \n    }\n}", "lang": "java"}, {"title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "difficulty": "Medium", "topics": ["Hash Table", "String", "Sliding Window"], "description": "Given a string s, find the length of the longest substring without duplicate characters.\n\n \n\nExample 1:\n\nInput: s = \"abcabcbb\"\nOutput: 3\nExplanation: The answer is \"abc\", with the length of 3. Note that \"bca\" and \"cab\" are also correct answers.\n\nExample 2:\n\nInput: s = \"bbbbb\"\nOutput: 1\nExplanation: The answer is \"b\", with the length of 1.\n\nExample 3:\n\nInput: s = \"pwwkew\"\nOutput: 3\nExplanation: The answer is \"wke\", with the length of 3.\nNotice that the answer must be a substring, \"pwke\" is a subsequence and not a substring.\n\n \n\nConstraints:\n\n\t0 <= s.length <= 105\n\n\ts consists of English letters, digits, symbols and spaces.", "code": "class Solution {\n    public int lengthOfLongestSubstring(String s){\n        int max=1;\n        if(s.length()==0){\n            return 0;\n        }\n        StringBuilder str=new StringBuilder();\n        str=str.append(s.charAt(0));\n        for(int i=1;i<s.length();i++){\n            if(str.toString().contains(Character.toString(s.charAt(i)))){\n                int idx=str.indexOf(Character.toString(s.charAt(i)));\n                str=str.delete(0,idx+1);\n                str=str.append(s.charAt(i));\n            }\n            else{\n              str=str.append(s.charAt(i));\n              int len=str.length();\n              if(len>max){\n                max=len;\n              }  \n            }\n\n        }\n        return max;\n    }\n}", "lang": "java"}, {"title": "Add Two Numbers", "slug": "add-two-numbers", "difficulty": "Medium", "topics": ["Linked List", "Math", "Recursion"], "description": "You are given two non-empty linked lists representing two non-negative integers. The digits are stored in reverse order, and each of their nodes contains a single digit. Add the two numbers and return the sum as a linked list.\n\nYou may assume the two numbers do not contain any leading zero, except the number 0 itself.\n\n \n\nExample 1:\n\nInput: l1 = [2,4,3], l2 = [5,6,4]\nOutput: [7,0,8]\nExplanation: 342 + 465 = 807.\n\nExample 2:\n\nInput: l1 = [0], l2 = [0]\nOutput: [0]\n\nExample 3:\n\nInput: l1 = [9,9,9,9,9,9,9], l2 = [9,9,9,9]\nOutput: [8,9,9,9,0,0,0,1]\n\n \n\nConstraints:\n\n\tThe number of nodes in each linked list is in the range [1, 100].\n\n\t0 <= Node.val <= 9\n\n\tIt is guaranteed that the list represents a number that does not have leading zeros.", "code": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode addTwoNumbers(ListNode l1, ListNode l2) {\n        ListNode dummy=new ListNode(-1);\n        ListNode head=dummy;\n        ListNode temp=head;\n        ListNode temp1=l1;\n        ListNode temp2=l2;\n        int carry=0;\n        while(temp1!=null || temp2!=null || carry>0){\n            int sum=0;\n            if(temp1!=null){\n                sum=sum+temp1.val;\n                temp1=temp1.next;\n            }\n            if(temp2!=null){\n                sum=sum+temp2.val;\n                 temp2=temp2.next;\n\n            }\n            sum=sum+carry;\n            int ans=sum %10;\n            ListNode p=new ListNode(ans);\n            temp.next=p;\n            temp=temp.next;\n            carry=sum/10;\n\n        }\n        head=head.next;\n        return head;\n\n    }\n}", "lang": "java"}, {"title": "Two Sum", "slug": "two-sum", "difficulty": "Easy", "topics": ["Array", "Hash Table"], "description": "You are given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target.\n\nYou may assume that each input would have exactly one solution, and you may not use the same element twice.\n\nYou can return the answer in any order.\n\n \n\nExample 1:\n\nInput: nums = [2,7,11,15], target = 9\nOutput: [0,1]\nExplanation: Because nums[0] + nums[1] == 9, we return [0, 1].\n\nExample 2:\n\nInput: nums = [3,2,4], target = 6\nOutput: [1,2]\n\nExample 3:\n\nInput: nums = [3,3], target = 6\nOutput: [0,1]\n\n \n\nConstraints:\n\n\t2 <= nums.length <= 104\n\n\t-109 <= nums[i] <= 109\n\n\t-109 <= target <= 109\n\n\tOnly one valid answer exists.\n\n \n\nFollow-up: Can you come up with an algorithm that is less than O(n2) time complexity?", "code": "class Solution {\n    public int[] twoSum(int[] nums, int target) {\n        int[] arr=new int[2];\n        for(int i=0;i<nums.length;i++){\n            for(int j=i+1;j<nums.length;j++){\n                if((nums[i]+nums[j])==target){\n                   arr[0]=i;\n                   arr[1]=j;\n                }\n            }\n        }\n        return arr;\n        \n    }\n}", "lang": "java"}]</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('lc-data').textContent);
  const PALETTE = ['#ff6f91','#5ee6c8','#6fc6ff','#ffb454','#b18cff','#ff8f5c','#67d99a','#f47fb0','#7aa8ff','#e6d95e'];
  function colorFor(name) {
    let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  let progress = {};
  try { progress = JSON.parse(localStorage.getItem('lc-flashcard-progress') || '{}'); } catch (e) { progress = {}; }
  // migrate old format where progress[slug] was a plain string ('known' | 'review')
  Object.keys(progress).forEach(slug => {
    if (typeof progress[slug] === 'string') progress[slug] = { status: progress[slug] };
  });
  function saveProgress() { try { localStorage.setItem('lc-flashcard-progress', JSON.stringify(progress)); } catch (e) {} }
  function getEntry(slug) { return progress[slug] || {}; }
  function setEntry(slug, patch) {
    const cur = getEntry(slug);
    const next = Object.assign({}, cur, patch);
    if (!next.status) delete next.status;
    if (!next.starred) delete next.starred;
    if (!next.note) delete next.note;
    if (Object.keys(next).length === 0) delete progress[slug]; else progress[slug] = next;
    saveProgress();
  }

  const topicCounts = {};
  data.forEach(q => q.topics.forEach(t => { topicCounts[t] = (topicCounts[t] || 0) + 1; }));
  const topics = Object.keys(topicCounts).sort((a,b) => topicCounts[b] - topicCounts[a]);

  const diffCounts = { Easy: 0, Medium: 0, Hard: 0 };
  data.forEach(q => { if (diffCounts[q.difficulty] !== undefined) diffCounts[q.difficulty]++; });

  document.getElementById('total-tally').textContent = data.length + ' solved';
  document.getElementById('diff-tally').innerHTML =
    '<span class="e">' + diffCounts.Easy + ' easy</span>' +
    '<span class="m">' + diffCounts.Medium + ' med</span>' +
    '<span class="h">' + diffCounts.Hard + ' hard</span>';

  const sidebar = document.getElementById('sidebar');
  const topicSelect = document.getElementById('topic-select');

  const expanded = new Set();

  function selectQuestion(topicName, slug) {
    state.topic = topicName;
    document.getElementById('topic-label').textContent = topicName;
    state.query = ''; document.getElementById('search').value = '';
    state.filter = 'all';
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === 'all'));
    computeList();
    const idx = state.list.findIndex(q => q.slug === slug);
    state.index = idx >= 0 ? idx : 0;
    state.flipped = false;
    expanded.add(topicName);
    buildSidebar();
    render();
  }

  function topicButton(name, count, isActive) {
    const wrap = document.createElement('div');
    wrap.className = 'topic-group';
    const b = document.createElement('button');
    b.className = 'topic-btn' + (isActive ? ' active' : '');
    const c = name === 'All' ? 'var(--accent1)' : colorFor(name);
    b.style.setProperty('--dot-color', c);
    const isExpanded = expanded.has(name);
    const arrow = name === 'All' ? '' : (isExpanded ? ' ▾' : ' ▸');
    b.innerHTML = '<span><span class="dot"></span>' + name + '</span><span class="count">' + count + arrow + '</span>';
    b.addEventListener('click', () => {
      setTopic(name);
      if (name !== 'All') {
        if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
        buildSidebar();
      }
    });
    wrap.appendChild(b);
    if (name !== 'All' && expanded.has(name)) {
      const sub = document.createElement('div');
      sub.className = 'subtopic-list';
      data.filter(q => q.topics.includes(name)).forEach(q => {
        const sb = document.createElement('button');
        sb.className = 'subtopic-btn';
        sb.textContent = q.title;
        sb.addEventListener('click', (e) => { e.stopPropagation(); selectQuestion(name, q.slug); });
        sub.appendChild(sb);
      });
      wrap.appendChild(sub);
    }
    return wrap;
  }

  function buildSidebar() {
    sidebar.innerHTML = '';
    sidebar.appendChild(topicButton('All', data.length, state.topic === 'All'));
    topics.forEach(t => sidebar.appendChild(topicButton(t, topicCounts[t], state.topic === t)));

    topicSelect.innerHTML = '';
    const allOpt = document.createElement('option'); allOpt.value = 'All'; allOpt.textContent = 'All (' + data.length + ')';
    topicSelect.appendChild(allOpt);
    topics.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t + ' (' + topicCounts[t] + ')'; topicSelect.appendChild(o); });
    topicSelect.value = state.topic;
  }

  const state = { topic: 'All', query: '', filter: 'all', index: 0, flipped: false, list: [] };

  function computeList() {
    let list = data;
    if (state.topic !== 'All') list = list.filter(q => q.topics.includes(state.topic));
    if (state.query.trim()) { const q = state.query.trim().toLowerCase(); list = list.filter(item => item.title.toLowerCase().includes(q)); }
    if (state.filter === 'known') list = list.filter(q => getEntry(q.slug).status === 'known');
    if (state.filter === 'review') list = list.filter(q => getEntry(q.slug).status === 'review');
    if (state.filter === 'starred') list = list.filter(q => getEntry(q.slug).starred);
    state.list = list;
    if (state.index >= list.length) state.index = 0;
  }

  function setTopic(t) {
    state.topic = t; state.index = 0; state.flipped = false;
    document.getElementById('topic-label').textContent = t;
    buildSidebar(); computeList(); render();
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const KEYWORDS = new Set(['public','private','protected','class','interface','extends','implements','static','final',
    'void','int','long','double','float','boolean','char','byte','short','new','return','if','else','for','while','do',
    'switch','case','break','continue','try','catch','finally','throw','throws','import','package','this','super',
    'null','true','false','abstract','synchronized','volatile','transient','enum','default','instanceof','def','elif',
    'from','as','lambda','with','yield','pass','None','True','False','and','or','not','in','is','let','const','var',
    'function','of','using','namespace','template','typename','struct','include','define','self','unsigned','signed']);

  function highlightCode(code) {
    const escaped = escapeHtml(code);
    const pattern = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|(#[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(\b\d+\.?\d*[fFlLdD]?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
    return escaped.replace(pattern, (m, c1, c2, c3, ds, ss, num, annot, word) => {
      if (c1 || c2 || c3) return '<span class="tok-comment">' + m + '</span>';
      if (ds || ss) return '<span class="tok-string">' + m + '</span>';
      if (num) return '<span class="tok-number">' + m + '</span>';
      if (annot) return '<span class="tok-annot">' + m + '</span>';
      if (word) {
        if (KEYWORDS.has(word)) return '<span class="tok-keyword">' + m + '</span>';
        if (/^[A-Z]/.test(word)) return '<span class="tok-type">' + m + '</span>';
        return m;
      }
      return m;
    });
  }

  function detectIndentUnit(code) {
    const lines = code.split('\n');
    let minIndent = null;
    for (const line of lines) {
      const m = line.match(/^ +/);
      if (m && line.trim().length > 0) {
        if (minIndent === null || m[0].length < minIndent) minIndent = m[0].length;
      }
    }
    return (minIndent && minIndent > 0) ? minIndent : 4;
  }

  function addIndentGuides(html, unit) {
    return html.replace(/^( +)/gm, (m, spaces) => {
      let out = '';
      let remaining = spaces.length;
