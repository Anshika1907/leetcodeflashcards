      while (remaining >= unit) {
        out += '<span class="indent-guide" style="width:' + unit + 'ch">' + ' '.repeat(unit) + '</span>';
        remaining -= unit;
      }
      if (remaining > 0) out += ' '.repeat(remaining);
      return out;
    });
  }

  function render() {
    const card = document.getElementById('card');
    const front = document.getElementById('face-front');
    const back = document.getElementById('face-back');
    const pos = document.getElementById('position');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const knowBtn = document.getElementById('mark-know');
    const reviewBtn = document.getElementById('mark-review');

    if (!state.list.length) {
      front.innerHTML = '<div class="empty-state">No cards match this filter.</div>';
      back.innerHTML = '';
      pos.textContent = '0 / 0';
      prevBtn.disabled = true; nextBtn.disabled = true;
      knowBtn.classList.remove('active'); reviewBtn.classList.remove('active');
      card.classList.remove('flipped');
      return;
    }

    const item = state.list[state.index];
    const topicChips = item.topics.map(t => {
      const c = colorFor(t);
      return '<span class="topic-chip" style="color:' + c + ';border-color:' + c + '">' + escapeHtml(t) + '</span>';
    }).join('');

    const descHtml = item.description
      ? '<div class="description">' + escapeHtml(item.description) + '</div>'
      : '<div class="description missing">Problem statement not captured for this card yet — re-run the updated export script and re-upload to add it.</div>';

    front.innerHTML =
      '<div class="front-head"><span class="card-diff ' + item.difficulty + '">' + item.difficulty + '</span></div>' +
      '<div class="card-title">' + escapeHtml(item.title) + '</div>' +
      '<div class="card-topics">' + topicChips + '</div>' +
      descHtml +
      '<div class="flip-hint">tap card to see your solution</div>';

    const codeStr = (item.code || '// no submission code captured').replace(/\t/g, '    ');
    const indentUnit = detectIndentUnit(codeStr);
    back.innerHTML =
      '<div class="accent-bar"></div>' +
      '<div class="face-back-head"><span class="mono">' + escapeHtml(item.title) + '</span><span class="lang">' + escapeHtml(item.lang || '') + '</span></div>' +
      '<div class="code-wrap"><pre class="code mono">' + addIndentGuides(highlightCode(codeStr), indentUnit) + '</pre></div>';

    pos.textContent = (state.index + 1) + ' / ' + state.list.length;
    prevBtn.disabled = state.index === 0;
    nextBtn.disabled = state.index === state.list.length - 1;
    card.classList.toggle('flipped', state.flipped);

    const status = getEntry(item.slug).status;
    knowBtn.classList.toggle('active', status === 'known');
    reviewBtn.classList.toggle('active', status === 'review');
    const starBtn = document.getElementById('mark-star');
    const starred = !!getEntry(item.slug).starred;
    starBtn.classList.toggle('active', starred);
    starBtn.textContent = (starred ? '★' : '☆') + ' Flag';
    const noteInput = document.getElementById('note-input');
    noteInput.value = getEntry(item.slug).note || '';
  }

  document.getElementById('card').addEventListener('click', () => { state.flipped = !state.flipped; render(); });
  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); if (state.index > 0) { state.index--; state.flipped = false; render(); } });
  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); if (state.index < state.list.length - 1) { state.index++; state.flipped = false; render(); } });

  document.getElementById('mark-know').addEventListener('click', (e) => {
    e.stopPropagation(); const item = state.list[state.index]; if (!item) return;
    const cur = getEntry(item.slug).status;
    setEntry(item.slug, { status: cur === 'known' ? undefined : 'known' });
    render();
  });
  document.getElementById('mark-review').addEventListener('click', (e) => {
    e.stopPropagation(); const item = state.list[state.index]; if (!item) return;
    const cur = getEntry(item.slug).status;
    setEntry(item.slug, { status: cur === 'review' ? undefined : 'review' });
    render();
  });
  document.getElementById('mark-star').addEventListener('click', (e) => {
    e.stopPropagation(); const item = state.list[state.index]; if (!item) return;
    setEntry(item.slug, { starred: !getEntry(item.slug).starred });
    render();
  });
  document.getElementById('note-input').addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('note-input').addEventListener('input', (e) => {
    const item = state.list[state.index]; if (!item) return;
    setEntry(item.slug, { note: e.target.value });
  });

  document.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    state.filter = p.dataset.filter; state.index = 0; state.flipped = false;
    computeList(); render();
  }));

  document.getElementById('search').addEventListener('input', (e) => {
    state.query = e.target.value; state.index = 0; state.flipped = false;
    computeList(); render();
  });

  topicSelect.addEventListener('change', (e) => setTopic(e.target.value));

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === document.getElementById('search')) return;
    if (document.activeElement === document.getElementById('note-input')) return;
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === ' ') { e.preventDefault(); document.getElementById('card').click(); }
  });

  buildSidebar(); computeList(); render();
})();
</script>
</body>
</html>
